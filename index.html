<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MC Guest Reservation</title>

  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
    import { marked } from 'https://cdn.jsdelivr.net/npm/marked@13/+esm';

    mermaid.initialize({
      startOnLoad: false,
      theme: 'default',
      themeVariables: {
        primaryColor: '#e1f5fe',
        primaryTextColor: '#000',
        primaryBorderColor: '#000',
        lineColor: '#000',
        secondaryColor: '#fff3e0',
        tertiaryColor: '#e8f5e8'
      }
    });

    marked.setOptions({ breaks: true, gfm: true });

    const contentEl = document.getElementById('content');

    async function renderDocumentation() {
      try {
        const response = await fetch('README.md', { cache: 'no-cache' });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const markdown = await response.text();
        const html = marked.parse(markdown);
        const processed = html.replace(
          /<pre><code class="language-mermaid">([\s\S]*?)<\/code><\/pre>/g,
          (_match, diagram) => `<div class="mermaid">${diagram.trim()}</div>`
        );

        contentEl.innerHTML = processed;
        await mermaid.run({ querySelector: '.mermaid' });
      } catch (error) {
        console.error('Failed to render documentation:', error);
        contentEl.innerHTML = `
          <div class="error">
            <p><strong>Failed to load documentation.</strong></p>
            <p>${error.message}</p>
          </div>
        `;
      }
    }

    renderDocumentation();
  </script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      line-height: 1.6;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      color: #333;
      background-color: #fff;
    }

    h1 {
      color: #2c3e50;
      border-bottom: 3px solid #3498db;
      padding-bottom: 10px;
    }

    h2 {
      color: #34495e;
      border-bottom: 2px solid #ecf0f1;
      padding-bottom: 8px;
      margin-top: 30px;
    }

    h3 {
      color: #555;
      margin-top: 25px;
    }

    pre {
      background-color: #f8f9fa;
      border: 1px solid #e1e4e8;
      border-radius: 6px;
      padding: 16px;
      overflow-x: auto;
    }

    code {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
      background-color: rgba(27,31,35,0.05);
      padding: 0.2em 0.4em;
      border-radius: 3px;
      font-size: 85%;
    }

    pre code {
      background-color: transparent;
      padding: 0;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin: 20px 0;
    }

    table th,
    table td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: left;
    }

    table th {
      background-color: #f6f8fa;
      font-weight: 600;
    }

    ul, ol {
      padding-left: 30px;
    }

    li {
      margin: 8px 0;
    }

    blockquote {
      border-left: 4px solid #dfe2e5;
      padding-left: 16px;
      margin: 16px 0;
      color: #6a737d;
    }

    a {
      color: #0366d6;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .mermaid {
      text-align: center;
      margin: 20px 0;
      background: #fff;
      padding: 20px;
      border: 1px solid #e1e4e8;
      border-radius: 6px;
    }

    hr {
      border: 0;
      border-top: 1px solid #eaecef;
      margin: 30px 0;
    }

    ::selection {
      background-color: #b3d4fc;
    }

    .error {
      background-color: #fff5f5;
      border: 1px solid #f5c2c7;
      color: #842029;
      padding: 16px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div id="content">
    <p>Loading...</p>
  </div>
</body>
</html>
